name: Build Oxide Cheat APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install NDK
        run: |
          sdkmanager "ndk;25.1.8937393"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || echo "No gradlew found, using default gradle or NDK build"

      - name: Build Release APK / Shared Library
        run: |
          # Если проект использует ndk-build или gradle, сборка пойдет здесь
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease
          else
            echo "Building via NDK directly..."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oxide-Cheat-APK
          path: |
            app/build/outputs/apk/release/*.apk
            **/build/outputs/apk/release/*.apk
            *.apk
