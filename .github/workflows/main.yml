name: Build Oxide Cheat APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-33 build-tools;33.0.2 ndk;25.1.8937393'

      - name: Create Project Files
        run: |
          mkdir -p app/src/main/cpp app/src/main/java/com/oxide/cheat
          
          # CMakeLists.txt
          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("oxidecheat")
          add_library(oxidecheat SHARED main.cpp)
          find_library(log-lib log)
          target_link_libraries(oxidecheat ${log-lib})
          EOF

          # main.cpp (ESP & Aimbot core)
          cat << 'EOF' > app/src/main/cpp/main.cpp
          #include <jni.h>
          #include <android/log.h>
          #include <cmath>
          #include <vector>
          #define LOG_TAG "WormShadow"
          #define LOGD(...) __android_log_print(ANDROID_LOG_DEBUG, LOG_TAG, __VA_ARGS__)
          
          struct Vector3 { float x, y, z; };
          struct Vector2 { float x, y; };
          
          extern "C" JNIEXPORT jint JNICALL
          Java_com_oxide_cheat_MainActivity_nativeInit(JNIEnv* env, jobject thiz) {
              LOGD("Oxide Cheat Initialized!");
              return 0;
          }
          EOF

          # build.gradle for app
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.oxide.cheat'
              compileSdk 33
              defaultConfig {
                  applicationId "com.oxide.cheat"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
                  externalNativeBuild { cmake { cppFlags "-std=c++17" } }
              }
              externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "OxideCheat"
          include ':app'
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.oxide.cheat">
              <application android:label="Oxide Cheat">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java
          cat << 'EOF' > app/src/main/java/com/oxide/cheat/MainActivity.java
          package com.oxide.cheat;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              static { System.loadLibrary("oxidecheat"); }
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setText("Oxide Cheat Loaded!");
                  setContentView(tv);
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oxide-Cheat-APK
          path: app/build/outputs/apk/release/*.apk
