name: Build Oxide Cheat APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-33 build-tools;33.0.2 ndk;25.1.8937393'

      - name: Create Complete Project Structure
        run: |
          # 1. Настройка gradle.properties
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          # 2. Создание структуры папок
          mkdir -p app/src/main/cpp app/src/main/java/com/oxide/modmenu
          
          # 3. CMakeLists.txt
          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("oxidecheat")
          add_library(oxidecheat SHARED main.cpp)
          find_library(log-lib log)
          target_link_libraries(oxidecheat ${log-lib})
          EOF

          # 4. main.cpp
          cat << 'EOF' > app/src/main/cpp/main.cpp
          #include <jni.h>
          #include <android/log.h>
          #define LOG_TAG "WormShadow"
          #define LOGD(...) __android_log_print(ANDROID_LOG_DEBUG, LOG_TAG, __VA_ARGS__)
          
          extern "C" JNIEXPORT jint JNICALL
          Java_com_oxide_modmenu_MainActivity_nativeInit(JNIEnv* env, jobject thiz) {
              LOGD("Oxide Mod Menu Initialized successfully!");
              return 0;
          }
          EOF

          # 5. app/build.gradle (namespace задает пакет здесь)
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.oxide.modmenu'
              compileSdk 33
              defaultConfig {
                  applicationId "com.oxide.modmenu"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17"
                          abiFilters 'armeabi-v7a', 'arm64-v8a'
                      }
                  }
              }
              externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          # 6. build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # 7. settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "OxideModMenu"
          include ':app'
          EOF

          # 8. AndroidManifest.xml (ЧИСТЫЙ: без устаревшего package="")
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Oxide Mod Menu" android:allowBackup="true" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 9. MainActivity.java
          cat << 'EOF' > app/src/main/java/com/oxide/modmenu/MainActivity.java
          package com.oxide.modmenu;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              static { System.loadLibrary("oxidecheat"); }
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setText("Oxide Mod Menu Loaded Successfully!");
                  setContentView(tv);
              }
          }
          EOF

      - name: Build Signed Debug APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oxide-ModMenu-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
